name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - run: python scripts/audit_public.py --tracked
      - run: python -m pytest -q
      - name: Desktop settings and first run
        run: |
          python tests/first_run_ui.py
          python tests/settings_models_ui.py
          python tests/settings_reasoning_ui.py
          python tests/settings_devices_ui.py
          python tests/desktop_match_ui.py
          python tests/desktop_reply_read_ui.py
          python tests/desktop_reply_stream_ui.py
          python tests/reply_ui_smoke.py
      - name: Mobile UI
        run: |
          node tests/mobile_reply_ui.js
          node tests/mobile_updates_ui.js
          node tests/mobile_projects_ui.js
          node tests/mobile_delivery_ui.js
  ubuntu-helper:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic accessibility tests
        run: |
          python tests/desktop_checks.py
          python tests/desktop_latest_checks.py
          python tests/desktop_turn_checks.py
          python tests/desktop_capture_checks.py
          python tests/desktop_projects_checks.py
          python tests/desktop_match_checks.py
          python tests/desktop_collection_checks.py
          python tests/desktop_attachment_checks.py
          python tests/desktop_delivery_status_checks.py
          python tests/desktop_progress_checks.py
