name: Build Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/audit_public.py --tracked
      - run: python -m PyInstaller --noconfirm --clean ClaudeBridgePortable.spec
      - run: python scripts/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeBridge-Windows
          path: |
            release/ClaudeBridge-Windows.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
