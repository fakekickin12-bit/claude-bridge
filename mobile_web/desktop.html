<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#122437">
  <title>Ubuntu 桌面 · Claude Bridge</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/desktop.css">
  <script src="/desktop.js" defer></script>
</head>
<body>
  <main class="desktop-shell">
    <header class="desktop-header">
      <a class="back-link" href="/" aria-label="返回 Claude Bridge">‹ <span>Claude Bridge</span></a>
      <h1>Ubuntu 桌面</h1>
      <span id="connection" class="connection" role="status">连接中</span>
      <button id="settings-toggle" type="button" class="icon-button" aria-controls="desktop-tools" aria-expanded="true" title="显示或收起操作栏">☰</button>
    </header>

    <section id="desktop-tools" class="desktop-tools" aria-label="桌面操作">
      <label class="mode-control"><span>触控</span><select id="pointer-mode" aria-label="触控模式">
        <option value="click">点击</option><option value="right">右键</option><option value="drag">拖动</option>
        <option value="scroll">滚动</option><option value="browse">浏览 / 缩放</option>
      </select></label>
      <label class="zoom-control"><span>画面</span><select id="zoom" aria-label="画面缩放">
        <option value="fit">适应窗口</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="custom" hidden>手势缩放</option>
      </select></label>
      <button id="refresh" type="button">刷新</button>
      <button id="fullscreen" type="button" title="全屏显示桌面">全屏</button>
    </section>

    <div id="notice" class="notice" role="status">正在连接已经登录的 Ubuntu 桌面…</div>
    <section id="login-required" class="login-required" hidden>
      <h2>请先登记此浏览器</h2>
      <p>使用 Claude Bridge 的设备配对后，再打开 Ubuntu 桌面。</p>
      <a class="primary-link" href="/">前往设备配对</a>
    </section>

    <div id="viewport" class="viewport" tabindex="0" aria-label="Ubuntu 当前桌面，使用触控模式操作" aria-disabled="true">
      <div id="stage" class="stage">
        <img id="screen" class="screen" alt="Ubuntu 当前桌面" draggable="false" hidden>
        <p id="empty-frame" class="empty-frame">正在获取桌面画面…</p>
        <span id="pointer-mark" class="pointer-mark" aria-hidden="true" hidden></span>
      </div>
    </div>

    <section id="input-panel" class="input-panel" aria-label="向 Ubuntu 输入">
      <form id="text-form" class="text-form">
        <label class="sr-only" for="remote-text">发到 Ubuntu 焦点位置的文字</label>
        <textarea id="remote-text" rows="2" maxlength="20000" placeholder="文字输入到 Ubuntu 当前焦点位置，支持中文…" autocapitalize="off" spellcheck="false"></textarea>
        <button id="send-text" type="submit" class="primary" disabled>输入文字</button>
      </form>
      <div class="key-row" aria-label="常用按键">
        <button type="button" data-key="Return" disabled>Enter</button>
        <button type="button" data-key="BackSpace" disabled>⌫</button>
        <button type="button" data-key="Tab" disabled>Tab</button>
        <button type="button" data-key="Escape" disabled>Esc</button>
        <select id="extra-key" aria-label="其他按键">
          <option value="Control_L+a">Ctrl+A</option><option value="Control_L+c">Ctrl+C</option><option value="Control_L+v">Ctrl+V</option>
          <option value="Control_L+x">Ctrl+X</option><option value="Control_L+z">Ctrl+Z</option><option value="Control_L+y">Ctrl+Y</option><option value="Control_L+s">Ctrl+S</option>
          <option value="Control_L+Shift_L+z">Ctrl+Shift+Z</option><option value="Shift_L+Tab">Shift+Tab</option><option value="Delete">Delete</option>
          <option value="Up">↑</option><option value="Down">↓</option><option value="Left">←</option><option value="Right">→</option>
          <option value="Home">Home</option><option value="End">End</option><option value="Prior">Page Up</option><option value="Next">Page Down</option><option value="Alt_L+Tab">Alt+Tab</option><option value="Super_L">Super</option>
        </select>
        <button id="send-key" type="button" disabled>按键</button>
        <button id="query-input" type="button" class="query-input" hidden>查询操作结果</button>
      </div>
      <p id="mode-hint" class="mode-hint">轻点单击，连续轻点双击。切换“滚动”可滑动滚屏；多指手势只缩放画面。</p>
    </section>
  </main>
</body>
</html>
